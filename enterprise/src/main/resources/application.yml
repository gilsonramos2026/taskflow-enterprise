spring:
  application:
    name: taskflow-enterprise
  threads:
    virtual:
      enabled: true # Habilita Virtual Threads (Java 21 / Project Loom)

  profiles:
    active: dev

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

---
# ===================== PERFIL: DEV =====================
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/taskflow_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

logging:
  level:
    com.taskflow.enterprise: DEBUG
    org.hibernate.SQL: DEBUG

---
# ===================== PERFIL: PROD =====================
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/taskflow_db}
    username: ${DATABASE_USERNAME:taskflow_user}
    password: ${DATABASE_PASSWORD:taskflow_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

logging:
  level:
    com.taskflow.enterprise: INFO
    org.hibernate.SQL: WARN

---
# ===================== COMUM: SERVER / SWAGGER / ACTUATOR =====================
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics" # Aspas adicionadas para evitar conflito de sintaxe YAML
  endpoint:
    health:
      show-details: when-authorized
